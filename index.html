<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Side Quest Project</title>
  <meta name="description" content="A collection of small side-quest browser games.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#14161a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Side Quests">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="launcher.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Side Quest Project</h1>
        <p class="lede">Small browser games about getting distracted. Pick one and play.</p>
      </div>
      <button id="install" class="install" type="button" hidden>Install app</button>
    </header>
    <section id="ios-install" class="notice" hidden aria-labelledby="ios-install-title">
      <h2 id="ios-install-title">Add to your Home Screen</h2>
      <ol>
        <li>Tap the <strong>Share</strong> button
          <svg class="share" viewBox="0 0 24 24" aria-label="Share icon" role="img"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5M5 11v9h14v-9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          in the toolbar.</li>
        <li>Choose <strong>Add to Home Screen</strong>.</li>
        <li>Tap <strong>Add</strong>. Side Quests now opens full-screen from your home screen.</li>
      </ol>
      <button id="ios-install-close" class="link" type="button">Close</button>
    </section>
    <ul id="games" class="grid" aria-live="polite"></ul>
    <p id="status" class="status">Loading games…</p>
  </main>
  <footer>
    <a href="https://github.com/MarEdv/side-quest">Source on GitHub</a>
  </footer>
  <script type="module" src="src/launcher.js"></script>
</body>
</html>
