<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Side Quest Project</title>
  <meta name="description" content="A collection of small side-quest browser games.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#14161a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="launcher.css">
</head>
<body>
  <main>
    <header>
      <h1>Side Quest Project</h1>
      <p class="lede">Small browser games about getting distracted. Pick one and play.</p>
    </header>
    <p id="moved" class="notice" hidden>Looking for <strong>Side Quest</strong>? It's now called
      <a href="games/garden-day/">Garden Day</a>. Your scores and settings are kept.</p>
    <ul id="games" class="grid" aria-live="polite"></ul>
    <p id="status" class="status">Loading games…</p>
  </main>
  <footer>
    <a href="https://github.com/MarEdv/side-quest">Source on GitHub</a>
  </footer>
  <script type="module" src="src/launcher.js"></script>
</body>
</html>
